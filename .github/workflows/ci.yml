name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      # xlsx@0.18 has known advisories (swap pending); don't block CI on it yet.
      - name: npm audit (prod)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
